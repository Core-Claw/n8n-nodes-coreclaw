name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        # --ignore-scripts skips @n8n/node-cli's `only-allow pnpm` preinstall hook
        # which otherwise fails the npm-based install in CI.
        run: 'npm ci --ignore-scripts'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      - name: Run tests
        # The endpointScope contract tests compare the node's implemented
        # endpoints against resources/openapi.contract.json, so a new upstream
        # CoreClaw endpoint fails CI until the node implements (or explicitly
        # excludes) it.
        run: 'npm test'
